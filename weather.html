<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        h2 {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color:  #222;
        }

        #result p {
            font-size: 16px;
            margin: 5px 0;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city">
    <br>
    <button onclick="getWeather()">Get Weather</button>

    <h2 id="result"></h2>
</div>

<script>
async function getWeather() {

    let city = document.getElementById("city").value;

    if (city === "") {
        alert("Enter city name");
        return;
    }

    let apiKey = "8614c3a69274c10101db2b924fe2bd39"; // your key

    let url =
     `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

    try {
        let response = await fetch(url);
        let data = await response.json();
        if (!response.ok) {
            document.getElementById("result").innerText = "Error: " + data.message;
            return;
        }

        // console.log(data);

        // if (data.cod == 401) {
        //     document.getElementById("result").innerText = "Invalid API Key";
        //     return;
        // }
 
        // if (data.cod == "404") {
        //     document.getElementById("result").innerText = "City not found";
        //     return;
        // }

        let temp = data.main.temp;
        let weather = data.weather[0].main;
        
        let icon = data.weather[0].icon;
        let humidity = data.main.humidity;
        let wind = data.wind.speed;

        console.log("ICON:", icon);
           let iconDisplay = "☁️";

if (weather === "Clear") iconDisplay = "☀️";
else if (weather === "Clouds") iconDisplay = "☁️";
else if (weather === "Rain") iconDisplay = "🌧️";

        document.getElementById("result").innerHTML = `
<h2>${city}</h2>

<p style="font-size: 50px;">${iconDisplay}</p>

<p>☁ ${weather}</p>
<p>🌡 Temperature: ${temp}°C</p>
<p>💧 Humidity: ${humidity}%</p>
<p>💨 Wind: ${wind} m/s</p>
`;
    } catch (error) {
        document.getElementById("result").innerText = "Error fetching data";
        console.log(error);
    }
}

document.getElementById("city").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        getWeather();
    }
});
</script>

</body>
</html>
