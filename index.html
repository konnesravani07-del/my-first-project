<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            margin-bottom: 40px;
        }

        .projects {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .btn {
            text-decoration: none;
            background: blue;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
        }

        .btn:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My Projects</h1>
    <p>Beginner Frontend Developer</p>

    <div class="projects">

        <div class="card">
            <h3>Student Result App</h3>
            <a class="btn" href="student.html">Open</a>
        </div>

        <div class="card">
            <h3>Calculator App</h3>
            <a class="btn" href="calculator.html">Open</a>
        </div>

    </div>
</div>

</body>
</html>
