<!DOCTYPE html>
<html>
<head>
    <title>Focus App</title>

    <style>
        body {
            font-family: Arial;
            background: #1e1e2f;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        .timer {
            font-size: 60px;
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .start { background: #4CAF50; }
        .pause { background: #ff9800; }
        .reset { background: #f44336; }

        button:hover {
            opacity: 0.8;
        }
        .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 30px;
    z-index: 1000;
}

.hidden {
    display: none;
}
.progress-container {
    width: 300px;
    height: 10px;
    background: #444;
    margin: 20px auto;
    border-radius: 10px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #4CAF50;
}
    </style>
</head>

<body>

<h1>🎯 Focus App</h1>
<input type="text" id="taskInput" placeholder="What are you focusing on?">

<p id="taskDisplay"></p>
<p id="sessionCount">Sessions Completed: 0</p>
<p id="quote"></p>

<div class="timer" id="timer">25:00</div>

<div class="progress-container">
    <div id="progressBar"></div>
</div>

<select id="timeSelect">
    <option value="300">5 Minutes</option>
    <option value="600">10 Minutes</option>
    <option value="1500" selected>25 Minutes</option>
</select>

<button class="start" onclick="startTimer()">Start</button>
<button class="pause" onclick="pauseTimer()">Pause</button>
<button class="reset" onclick="resetTimer()">Reset</button>

<audio id="alarmSound">
    <source src="alarm.mp3" type="audio/mpeg">
</audio>

<div id="focusOverlay" class="overlay hidden">
    <h2>🚫 Distractions Blocked</h2>
    <p>Stay focused on your task 💪</p>
</div>

<script>
   let alarmSound = new Audio("alarm.mp3");
let time = 1500;
let timerInterval;

let quotes = [
    "Stay focused 🔥",
    "Small steps every day 💪",
    "Discipline beats motivation 🚀",
    "Keep going 👑",
    "One session at a time ⏳"
];

let sessions = localStorage.getItem("sessions") || 0;
document.getElementById("sessionCount").innerText =
    "Sessions Completed: " + sessions;

let savedTask = localStorage.getItem("currentTask");

if (savedTask) {
    document.getElementById("taskDisplay").innerText = "Focus: " + savedTask;
}

// update display
function updateDisplay() {
    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    document.getElementById("timer").innerText =
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0');
        let selectedTime = parseInt(document.getElementById("timeSelect").value);

let progress =
    ((selectedTime - time) / selectedTime) * 100;

document.getElementById("progressBar").style.width =
    progress + "%";
}

// start
function startTimer() {

    // 🔊 unlock sound (IMPORTANT)
    alarmSound.play().then(() => {
        alarmSound.pause();
        alarmSound.currentTime = 0;
    }).catch(() => {});

    if (timerInterval) return;

    let task = document.getElementById("taskInput").value;

    localStorage.setItem("currentTask", task);

    document.getElementById("taskDisplay").innerText = "Focus: " + task;

    time = parseInt(document.getElementById("timeSelect").value);
    updateDisplay();

    document.getElementById("focusOverlay").classList.remove("hidden");

    let randomQuote =
    quotes[Math.floor(Math.random() * quotes.length)];

document.getElementById("quote").innerText =
    randomQuote;

    timerInterval = setInterval(() => {
        if (time > 0) {
            time--;
            updateDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;

            document.getElementById("taskDisplay").innerText =
                "🎉 Session Completed!";

            document.getElementById("focusOverlay").classList.add("hidden");

            sessions++;
            localStorage.setItem("sessions", sessions);

            document.getElementById("sessionCount").innerText =
                "Sessions Completed: " + sessions;

            // 🔊 PLAY SOUND (ONLY THIS)
            alarmSound.currentTime = 0;
            alarmSound.play();

            alert("Great job! You finished your focus session 💪");
        }
    }, 1000);
}

// pause
function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

// reset
function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    time = parseInt(document.getElementById("timeSelect").value);
    updateDisplay();
}

// initialize display
updateDisplay();
</script>

</body>
</html>
